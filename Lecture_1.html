ar(--b);display:grid;place-content:center;text-align:center;font-weight:900;z-index:4}.a{left:7%;top:62px}.b{right:7%;top:62px;border-color:var(--g)}.c{left:calc(50% - 43px);top:165px;border-color:var(--v)}.d{display:none;right:22%;top:165px;border-color:var(--o)}.service{position:absolute;left:calc(50% - 58px);top:42px;width:116px;padding:12px;background:#172554;color:#fff;border-radius:12px;text-align:center;font-weight:800;z-index:3}.line{position:absolute;left:18%;right:18%;top:105px;height:3px;background:#b4c7e1;z-index:1}.packet{display:none;position:absolute;left:20%;top:90px;background:var(--o);color:white;padding:7px;border-radius:8px;z-index:6}.packet.go{display:block;animation:go 1.3s forwards}@keyframes go{to{left:70%}}.caption{position:absolute;left:16px;right:16px;bottom:12px;min-height:58px;padding:10px 14px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;text-align:center;color:var(--mut);font-size:14px;line-height:1.35;z-index:8;display:flex;align-items:center;justify-content:center}.controls{display:flex;gap:8px;margin-top:14px}.next{background:var(--b);color:#fff;flex:1}.agenda{margin-top:15px;padding:14px;max-height:310px;overflow:auto}.agenda div{padding:6px;color:var(--mut);font-size:13px}.agenda .active{color:var(--b);font-weight:900}.teacherPanel{display:none;position:fixed;inset:4%;z-index:20;background:#fff;border:3px solid #172554;border-radius:20px;box-shadow:0 20px 70px #0007;padding:22px;overflow:auto}.teacherPanel.show{display:block}.teacherGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.note{padding:15px;border-radius:12px;background:#f5f7fb;line-height:1.6}.book{background:#fff7db}.close{float:right;background:var(--r);color:#fff}.quiz{display:none;margin-top:15px;background:#fff8e7;padding:16px;border-radius:14px}.quiz.show{display:block}.answer{display:block;width:100%;text-align:start;background:#fff;border:1px solid var(--line);margin:6px}.ok{background:#dcfce7!important}.bad{background:#fee2e2!important}@media(max-width:850px){header{align-items:flex-start;flex-direction:column}.headerActions{width:100%;justify-content:space-between}.topTabs{max-width:100%;overflow-x:auto}.layout,.teacherGrid{grid-template-columns:1fr}.stage{height:390px;padding-bottom:90px}.a{left:4%;top:58px}.b{right:4%;top:58px}.c{top:160px}.caption{left:10px;right:10px;bottom:10px;min-height:72px;font-size:13px}}</style></head><body><div class="app"><header><div><div class="tag">DISTRIBUTED SYSTEMS · CHAPTER 1</div><h1>Lecture 1: Introduction to Distributed Systems</h1><div id="pageRef"></div></div><div class="headerActions"><nav class="topTabs" aria-label="Distributed systems resources"><a class="topTab active" href="#" onclick="return false" aria-current="page">Lecture 1</a><a class="topTab" href="https://gehadtaher-hub.github.io/Ebooks/studio.html" target="_blank" rel="noopener noreferrer">Distributed Systems Links <span class="externalIcon" aria-hidden="true">↗</span></a></nav><button class="teacherBtn" id="teacher">Instructor Notes</button></div></header><div class="progress" id="progress"></div><div class="layout"><main class="card main"><div class="tag" id="stepTag"></div><h2 id="title"></h2><div class="studentExplain" id="student"></div><div class="example"><div class="label">EXAMPLE FOR STUDENTS</div><div id="example"></div></div><div class="stage"><div class="line"></div><div class="service">ONE SERVICE</div><div class="node a">NODE A</div><div class="node b" id="b">NODE B</div><div class="node c">NODE C</div><div class="node d" id="d">NODE D</div><div class="packet" id="packet">MESSAGE</div><div class="caption" id="caption"></div></div><section class="quiz" id="quiz"><h3>Chapter 1 Quiz</h3><div id="questions"></div><b id="score"></b></section></main><aside><section class="card side"><div class="label">QUESTION FOR STUDENTS</div><h3 id="ask"></h3><div class="controls"><button class="ghost" id="restart">↺</button><button class="ghost" id="prev">← Previous</button><button class="next" id="next">Next →</button></div></section><section class="card agenda" id="agenda"></section></aside></div></div><section class="teacherPanel" id="teacherPanel"><button class="close" id="close">Close Notes</button><h2 id="teacherTitle"></h2><div class="teacherGrid"><div class="note"><div class="label">WHAT TO SAY</div><div id="say"></div></div><div class="note"><div class="label">WHAT TO DO IN CLASS</div><div id="do"></div></div><div class="note book"><div class="label">EXPLAIN FROM THE BOOK</div><div id="book"></div></div><div class="note"><div class="label">STUDENT QUESTION</div><div id="teacherAsk"></div></div></div></section><script>
const data=[["Google Maps: many computers, one result", "9–10", "When a user asks Google Maps for a route, many independent computers cooperate to provide location, traffic, route, and arrival-time information. The user sees one service rather than the individual machines.", "An online course platform can use different servers for login, course files, video, quizzes, and notifications.", "Ask whether one computer performs every Google Maps task. Let students name the hidden services, then emphasize independent computers, network communication, and one visible result.", "Point to each node while naming a possible service. Explain that the visible result is assembled from several services.", "Use the opening Google Maps story and Figures 1.1–1.2. Explain that distributed systems are hidden engines behind familiar services."], ["Definition of a distributed system", "9–10", "A distributed system is a group of independent computers that communicate over a network, share resources or data, and coordinate tasks to achieve a common goal. The computers may appear as one system to the user.", "A university portal may use separate services for authentication, registration, payments, grades, and notifications.", "Stress four phrases: independent computers; communicate over a network; coordinate tasks; appear as one system.", "Point to the separate nodes and explain that every node has its own processor, memory, and possible failure.", "Explain the definition and the three ideas in Section 1.1.1: communication, shared resources or data, and coordination toward a common goal."], ["We live in a world of data", "9–11", "Clicks, transactions, sensors, scientific instruments, vehicles, and healthcare systems continuously generate data. Distributed systems provide storage and processing capacity for its volume, speed, and variety.", "Astronomy distributes telescope data; genome analysis uses computing pipelines; smart-city sensors send continuous readings.", "Ask students for campus data sources. Separate data volume from data velocity.", "Use the nodes as storage and processing workers. Explain that storing more data does not automatically make analysis faster.", "Use the astronomy, gene-sequencing, sensor, and ubiquitous-computing examples in Sections 1.1.1–1.1.2."], ["Vertical scaling: scale up", "12", "Vertical scaling increases the capacity of one machine by adding CPU, memory, faster storage, or network capacity. It is simple, but one machine has physical limits and can remain a single point of failure.", "Upgrade a database server from 32 GB to 128 GB RAM so more indexes remain in memory.", "Explain why scale-up is attractive first, then ask what happens at the hardware limit or if the machine fails.", "Focus attention on Node A as the upgraded machine.", "Explain Section 1.1.3’s advantages and disadvantages: simplicity, limits, cost, and single point of failure."], ["Horizontal scaling: scale out", "12–14", "Horizontal scaling adds machines and distributes traffic or data among them. It improves capacity and fault isolation, but requires load balancing, partitioning, communication, and consistency management.", "During course registration, several application servers share thousands of requests behind a load balancer.", "Contrast making one machine bigger with adding more machines. Ask whether adding servers alone prevents conflicting seat updates.", "Node D appears to represent extra capacity. Explain that software must decide where requests and data go.", "Teach the benefits and complexity listed in Section 1.1.3 and the motivation continued in Section 1.2."], ["Feature: geographical separation", "12–13", "Components may be in different rooms, data centers, cities, or continents. Separation supports global reach and redundancy, but introduces latency and network reliability concerns.", "A content delivery network stores video copies near viewers to reduce playback delay.", "Ask why placing a copy near a user helps and what happens when copies contain different versions.", "Treat A and B as two regions and describe the distance crossed by the message.", "Use Feature 1 in Section 1.1.5 and the content-delivery example."], ["Feature: no common physical clock", "13", "Every computer has a local clock, and clocks can drift. Network delay makes exact global event ordering difficult. Logical clocks are later used to reason about causality.", "A records 10:00:00.010 while B records 10:00:00.005; these readings alone may not prove which related event happened first.", "Ask whether an earlier timestamp always proves an earlier event. Introduce drift and unpredictable delay.", "Compare the clock labels on A and B, then send a delayed message.", "Explain Feature 2 in Section 1.1.5 and only preview Lamport and vector clocks."], ["Features: no shared memory and heterogeneity", "13", "Each node has local memory, so computers coordinate through messages. Nodes may use different hardware, operating systems, languages, and policies; agreed protocols enable interoperability.", "An Android app, Linux API server, and cloud database can cooperate through APIs and standard message formats.", "Compare a local variable with remote state. Explain that a pointer from one machine is not automatically meaningful on another.", "Show a value travelling as a message rather than being read directly from remote memory.", "Combine Features 3 and 4 in Section 1.1.5: local memory, message passing, autonomy, heterogeneity, and standard protocols."], ["Parallel versus distributed systems", "14–15", "Parallel systems are often tightly coupled, may share memory, and cooperate on one computation. Distributed systems use loosely coupled nodes with independent memory and clocks. Some systems are both.", "Matrix multiplication on one multicore server is parallel; a global web application across regions is distributed; a scientific cluster may be both.", "Use the book’s comparison dimensions and avoid presenting the distinction as absolute.", "Ask students to classify the three examples before revealing the explanation.", "Explain Figure 1.6 and Table 1.1. Focus on reasoning rather than memorizing the table."], ["Why use distributed systems?", "13–16", "Distributed systems support scalability, availability, geographical reach, resource sharing, and large workloads. These benefits introduce communication delay, consistency challenges, security concerns, and independent failures.", "A global service places computation near users, replicates important data, and routes requests away from failed instances.", "Ask students to rank correctness, availability, latency, and scalability for an online examination system.", "Node B is shown failed while A and C remain active. Discuss whether the whole service should continue.", "Use Section 1.2 to connect hardware limits, horizontal scaling, fault isolation, and coordination problems."], ["Netflix case study", "16", "Netflix combines nearby content delivery, cooperating services, traffic balancing, service discovery, recommendation processing, and failure testing to serve many viewers responsively.", "When a viewer presses Play, a nearby server streams video while separate services manage authorization, recommendations, and viewing history.", "Trace one Play request and distinguish the critical playback path from supporting functions.", "Let the message represent Play. Ask which supporting service could fail without stopping an already playing video.", "Explain the ideas in Section 1.3: content delivery, microservices, failures, discovery, load balancing, recommendations, and deliberate failure testing."], ["Chapter review and quiz", "17–19", "Review the chapter by connecting the definition, scaling, core features, parallel-system differences, and the Netflix case study.", "A strong definition uses the terms independent computers, network messages, coordination, and common goal.", "Let students answer individually, compare with a partner, and justify each answer.", "Run the quiz and use incorrect choices to revisit the relevant concept.", "Use the exercise themes on page 17 and selected multiple-choice concepts on pages 18–19."]],quizData=[["Which description is most complete?", ["Independent computers coordinating through network messages toward a common goal", "One computer with many browser tabs", "Computers that never communicate"], 0], ["Which is vertical scaling?", ["Adding RAM to one server", "Adding four servers", "Placing copies in regions"], 0], ["Why is message passing necessary?", ["Nodes have independent physical memory", "All nodes share every variable", "Messages eliminate failures"], 0], ["Which feature complicates event ordering?", ["No common physical clock", "A common user interface", "Using APIs"], 0], ["What can horizontal scaling introduce?", ["Load-balancing and consistency complexity", "A perfect global clock", "Shared physical memory"], 0], ["What helps Netflix reduce playback latency?", ["Serving content from a nearby location", "One worldwide server", "Removing replicas"], 0]];let step=0,score=0,answered={};const $=q=>document.querySelector(q);function render(){let s=data[step];$('#stepTag').textContent=(step+1)+' / '+data.length;$('#title').textContent=s[0];$('#student').textContent=s[2];$('#example').textContent=s[3];$('#caption').textContent=s[3];$('#ask').textContent=s[4];$('#pageRef').textContent='Book alignment: Distributed_ebook_2025a.pdf · pages '+s[1];$('#teacherTitle').textContent='Instructor Notes — '+s[0];$('#say').textContent=s[4];$('#do').textContent=s[5];$('#book').textContent=s[6];$('#teacherAsk').textContent=s[4];$('#progress').innerHTML=data.map((_,i)=>'<div class="tick '+(i<step?'done':i===step?'now':'')+'"></div>').join('');$('#agenda').innerHTML=data.map((x,i)=>'<div class="'+(i===step?'active':'')+'">'+(i+1)+'. '+x[0]+' · pp. '+x[1]+'</div>').join('');$('#d').style.display=s[0]==='Horizontal scaling: scale out'?'grid':'none';$('#packet').className=['Google Maps: many computers, one result','Features: no shared memory and heterogeneity','Netflix case study'].includes(s[0])?'packet go':'packet';$('#b').style.borderColor=s[0]==='Why use distributed systems?'?'var(--r)':'var(--g)';$('#b').style.background=s[0]==='Why use distributed systems?'?'#fee2e2':'#fff';$('#quiz').classList.toggle('show',step===data.length-1);if(step===data.length-1)renderQuiz();$('#next').textContent=step===data.length-1?'Restart Lecture':'Next →'}function renderQuiz(){$('#questions').innerHTML=quizData.map((q,qi)=>'<div><p><b>'+(qi+1)+'. '+q[0]+'</b></p>'+q[1].map((a,ai)=>'<button class="answer" onclick="answer('+qi+','+ai+',this)">'+a+'</button>').join('')+'</div>').join('');$('#score').textContent=''}function answer(q,a,e){if(answered[q])return;answered[q]=1;let ok=a===quizData[q][2];if(ok)score++;e.classList.add(ok?'ok':'bad');$('#score').textContent='Score: '+score+' / '+quizData.length}$('#teacher').onclick=()=>$('#teacherPanel').classList.add('show');$('#close').onclick=()=>$('#teacherPanel').classList.remove('show');$('#next').onclick=()=>{step=step===data.length-1?0:step+1;render()};$('#prev').onclick=()=>{step=Math.max(0,step-1);render()};$('#restart').onclick=()=>{step=0;score=0;answered={};render()};render();
</script></body></html>
