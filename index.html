<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18324a"><title>Distributed Systems Ebook</title>
<style>:root{--ink:#263238;--navy:#18324a;--wine:#7a263a;--gold:#c59b45;--cream:#fffaf0;--line:#dbcba8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif;background:radial-gradient(circle at top,#fbf7ed,#e7dcc4 72%);color:var(--ink)}header{background:linear-gradient(110deg,var(--navy),#244d6c);color:#fff;padding:12px 20px;border-bottom:5px solid var(--gold);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(22px,4vw,34px);margin:0}.subtitle{font-size:13px;color:#f1ddb0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.toolbar button,.toolbar input{border:1px solid #c9a755;border-radius:12px;padding:10px 14px;background:#fffaf0;color:var(--navy);font-weight:700;text-decoration:none;cursor:pointer}.btn.active{background:var(--wine);color:#fff}.wrap{padding:12px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px}.toolbar input{width:72px}.book-shell{height:calc(100vh - 160px);min-height:440px;display:flex;align-items:center;justify-content:center;overflow:hidden}.flip-book{display:none;filter:drop-shadow(0 14px 20px #362a2260)}.page{background:white;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px #cbb98e}.page canvas{width:100%;height:100%;object-fit:contain}.link-layer{position:absolute;inset:0}.pdf-link{position:absolute;border:0;background:transparent;cursor:pointer}.pdf-link:hover,.pdf-link:focus{background:#c59b4538;outline:2px solid var(--gold)}.loading{padding:30px;background:var(--cream);border:1px solid var(--line);border-radius:16px;text-align:center}.error{color:#a23a3a}@media(max-width:700px){header{align-items:flex-start}.book-shell{height:calc(100vh - 230px)}.btn{padding:9px 11px;font-size:12px}.hint{display:none}}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script></head>
<body><header><div><h1 id="pageTitle">Distributed Systems Ebook</h1><div id="subtitle" class="subtitle">Interactive page-turning edition with clickable contents and links</div></div><nav class="actions"><a id="ebookBtn" class="btn" href="index.html">📘 Main Ebook</a><a id="labBtn" class="btn" href="index.html?book=lab">🧪 Lab Manual</a><a class="btn" href="studio.html">⚙️ Learning Studio</a></nav></header>
<main class="wrap"><div class="toolbar"><button id="prev" disabled>Previous</button><span id="status">Preparing book…</span><span class="hint">Table-of-contents entries and PDF links are clickable</span><button id="next" disabled>Next</button><label>Page <input id="pageNo" type="number" min="1" value="1" disabled></label></div><div class="book-shell"><div id="loading" class="loading"><h2>Opening the interactive book…</h2><p>Please wait while the pages and links are prepared.</p></div><div id="book" class="flip-book"></div></div></main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const isLab=new URLSearchParams(location.search).get('book')==='lab',file=isLab?'LabManual-DistributedSystems.pdf':'Distributed_ebook_2025a.pdf',title=isLab?'Distributed Systems Lab Manual':'Distributed Systems Ebook';
const root=document.getElementById('book'),loading=document.getElementById('loading'),statusEl=document.getElementById('status'),pageNo=document.getElementById('pageNo'),prev=document.getElementById('prev'),next=document.getElementById('next');document.title=title;pageTitle.textContent=title;subtitle.textContent=isLab?'Practical laboratories, exercises, and applied activities':'Interactive page-turning edition with clickable contents and links';document.getElementById(isLab?'labBtn':'ebookBtn').classList.add('active');let pdfDoc,flip,total=0;
async function destinationPage(dest){try{const d=typeof dest==='string'?await pdfDoc.getDestination(dest):dest;if(!d)return null;return typeof d[0]==='object'?(await pdfDoc.getPageIndex(d[0]))+1:(Number.isInteger(d[0])?d[0]+1:null)}catch{return null}}
async function addLinks(page,holder,viewport){const anns=await page.getAnnotations({intent:'display'}),layer=document.createElement('div');layer.className='link-layer';for(const a of anns){if(a.subtype!=='Link'||!a.rect)continue;const r=viewport.convertToViewportRectangle(a.rect),el=document.createElement('button'),x=Math.min(r[0],r[2]),y=Math.min(r[1],r[3]);el.className='pdf-link';el.type='button';el.style.left=x/viewport.width*100+'%';el.style.top=y/viewport.height*100+'%';el.style.width=Math.abs(r[2]-r[0])/viewport.width*100+'%';el.style.height=Math.abs(r[3]-r[1])/viewport.height*100+'%';el.title=a.url?'Open link':'Go to section';el.onclick=async e=>{e.preventDefault();e.stopPropagation();if(a.url)window.open(a.url,'_blank','noopener');else{const p=await destinationPage(a.dest);if(p)flip.flip(p-1)}};layer.appendChild(el)}holder.appendChild(layer)}
(async()=>{try{pdfDoc=await pdfjsLib.getDocument(file).promise;total=pdfDoc.numPages;pageNo.max=total;for(let n=1;n<=total;n++){statusEl.textContent='Preparing '+n+' of '+total;const page=await pdfDoc.getPage(n),vp=page.getViewport({scale:1.35}),canvas=document.createElement('canvas'),holder=document.createElement('div');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;holder.className='page';if(n===1)holder.dataset.density='hard';holder.appendChild(canvas);await addLinks(page,holder,vp);root.appendChild(holder)}loading.style.display='none';root.style.display='block';flip=new St.PageFlip(root,{width:550,height:730,size:'stretch',minWidth:250,maxWidth:650,minHeight:340,maxHeight:780,showCover:true,usePortrait:true,mobileScrollSupport:false,drawShadow:true,flippingTime:650});flip.loadFromHTML(root.querySelectorAll('.page'));flip.on('flip',e=>{pageNo.value=e.data+1;statusEl.textContent='Page '+(e.data+1)+' of '+total});prev.disabled=next.disabled=pageNo.disabled=false;statusEl.textContent='Page 1 of '+total}catch(e){loading.innerHTML='<h2 class="error">The interactive book could not be opened</h2><p>Make sure <b>'+file+'</b> is in the same folder as index.html and the site is served through GitHub Pages or a web server.</p><small>'+e.message+'</small>';statusEl.textContent='Unable to open book'}})();prev.onclick=()=>flip&&flip.flipPrev();next.onclick=()=>flip&&flip.flipNext();pageNo.onchange=()=>flip&&flip.flip(Math.max(1,Math.min(total,+pageNo.value||1))-1);
</script></body></html>
