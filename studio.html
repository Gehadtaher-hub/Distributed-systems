<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributed Systems Studio</title><style>
:root{--bg:#eee5d3;--card:#fffaf0;--ink:#263238;--navy:#18324a;--wine:#7a263a;--line:#d8c8a4;--gold:#c59b45;--good:#26734d;--bad:#a23a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}header{background:var(--navy);color:#fff;padding:12px 18px;border-bottom:5px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:var(--card);padding:12px}main{max-width:1050px;width:100%;padding:18px;margin:auto}.nav,.btn{border:1px solid var(--gold);border-radius:9px;padding:10px 12px;font:bold 14px system-ui;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;background:var(--card);color:var(--ink)}.nav.active,.primary{background:var(--wine);color:#fff}.secondary{background:var(--card);color:var(--navy)}a{text-decoration:none}.card,.box,.question{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.big{font-size:32px;color:var(--wine);font-weight:bold}.option{display:block;border:1px solid var(--line);padding:10px;border-radius:8px;margin:7px 0}select,input{width:100%;padding:10px;margin:5px 0}.good{color:var(--good)}.bad{color:var(--bad)}.timer{font-size:24px;font-weight:bold}.status{font-weight:bold;color:var(--wine)}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:130px}main{padding:10px}}</style></head><body>
<header><h1>Distributed Systems Studio</h1><div><a class="btn secondary" href="index.html">Back to eBook</a> <span>Guest</span></div></header><div class="layout"><aside id="nav"></aside><main id="app"></main></div>
<script src="question_bank.js"></script><script>
'use strict';
const bank=window.DS_QUESTION_BANK||[];
const topics=window.DS_QUESTION_TOPICS||[];
let practiceSession=null,examSession=null,timerId=0,history=[];const app=document.getElementById('app'),nav=document.getElementById('nav');
function sample(count,topic){const source=[];for(let i=0;i<bank.length;i++)if(!topic||bank[i].topic===topic)source.push(bank[i]);for(let i=source.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),x=source[i];source[i]=source[j];source[j]=x}return source.slice(0,Math.min(count,source.length))}
const pages={Dashboard:home,Practice:practicePage,Simulators:simulators,'Timed Exam':examPage,Reports:reports};for(const name in pages){const b=document.createElement('button');b.className='nav';b.textContent=name;b.onclick=function(){openPage(name,b)};nav.appendChild(b)}nav.firstChild.classList.add('active');function openPage(name,b){clearInterval(timerId);const buttons=nav.querySelectorAll('button');for(let i=0;i<buttons.length;i++)buttons[i].classList.remove('active');b.classList.add('active');pages[name]()}
function home(){if(!bank.length){app.innerHTML='<section class="card"><h2 class="bad">Question bank not loaded</h2><p>Upload question_bank.js in the same folder as studio.html.</p></section>';return}app.innerHTML='<section class="card"><h2>Reliable Mobile Edition</h2><p>This edition avoids browser storage enumeration and renders one question at a time.</p><div class="grid"><div class="box"><div class="big">150</div>unique questions</div><div class="box"><div class="big">'+history.length+'</div>exam reports</div></div></section>'}
function practicePage(){let options='';for(let i=0;i<topics.length;i++)options+='<option value="'+topics[i]+'">'+topics[i]+'</option>';app.innerHTML='<section class="card"><h2>Practice</h2><label>Topic<select id="practiceTopic">'+options+'</select></label><label>Questions<select id="practiceCount"><option>5</option><option selected>10</option><option>15</option></select></label><button type="button" class="btn primary" id="practiceStart">Start practice</button><p id="practiceError" class="bad"></p><div id="practiceArea"></div></section>';document.getElementById('practiceStart').onclick=startPractice}
function startPractice(){try{const topic=document.getElementById('practiceTopic').value,count=parseInt(document.getElementById('practiceCount').value,10);practiceSession={items:sample(count,topic),index:0,answers:[],checked:[],correct:0};renderPractice()}catch(e){document.getElementById('practiceError').textContent='Could not start: '+e.message}}
function renderPractice(){const s=practiceSession,i=s.index,q=s.items[i],area=document.getElementById('practiceArea');let choices='';for(let j=0;j<q.options.length;j++)choices+='<label class="option"><input type="radio" name="pa" value="'+j+'" '+(s.answers[i]===j?'checked':'')+'> '+q.options[j]+'</label>';let feedback='';if(s.checked[i]!==undefined)feedback='<p class="'+(s.checked[i]?'good':'bad')+'">'+(s.checked[i]?'Correct. ':'Incorrect. ')+q.explanation+'</p>';area.innerHTML='<div class="box"><b>Question '+(i+1)+' of '+s.items.length+'</b></div><div class="question"><small>'+q.topic+' • '+q.id+'</small><h2>'+q.question+'</h2>'+choices+feedback+'</div><div class="row"><button id="pp" class="btn secondary">Previous</button><button id="pc" class="btn primary">Check</button><button id="pn" class="btn secondary">Next</button><button id="pf" class="btn secondary">Finish</button></div>';const radios=area.querySelectorAll('input[name=pa]');for(let r=0;r<radios.length;r++)radios[r].onchange=function(){s.answers[i]=parseInt(this.value,10)};document.getElementById('pp').onclick=function(){s.index=Math.max(0,i-1);renderPractice()};document.getElementById('pn').onclick=function(){s.index=Math.min(s.items.length-1,i+1);renderPractice()};document.getElementById('pc').onclick=function(){if(s.answers[i]===undefined){alert('Select an answer first.');return}if(s.checked[i]===undefined&&s.answers[i]===q.answer)s.correct++;s.checked[i]=s.answers[i]===q.answer;renderPractice()};document.getElementById('pf').onclick=function(){area.innerHTML='<div class="box"><div class="big">'+s.correct+'/'+s.items.length+'</div><p>Practice complete.</p></div>'}}
function examPage(){app.innerHTML='<section class="card"><h2>Timed Exam</h2><label>Questions<select id="examCount"><option>20</option><option>40</option><option>60</option><option>80</option></select></label><label>Minutes<select id="examMinutes"><option>20</option><option selected>40</option><option>60</option><option>80</option><option>120</option></select></label><button type="button" class="btn primary" id="examStart">Start exam</button><p id="examError" class="bad"></p><div id="examArea"></div></section>';document.getElementById('examStart').onclick=startExam}
function startExam(){try{const count=parseInt(document.getElementById('examCount').value,10),minutes=parseInt(document.getElementById('examMinutes').value,10);examSession={items:sample(count),index:0,answers:[],seconds:minutes*60,start:Date.now(),done:false};renderExam();timerId=setInterval(function(){if(!examSession||examSession.done)return;examSession.seconds--;const clock=document.getElementById('clock');if(clock)clock.textContent=formatTime(examSession.seconds);if(examSession.seconds<=0)submitExam()},1000)}catch(e){document.getElementById('examError').textContent='Could not start: '+e.message}}
function formatTime(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderExam(){const s=examSession,i=s.index,q=s.items[i],area=document.getElementById('examArea');let choices='';for(let j=0;j<q.options.length;j++)choices+='<label class="option"><input type="radio" name="ea" value="'+j+'" '+(s.answers[i]===j?'checked':'')+'> '+q.options[j]+'</label>';area.innerHTML='<div class="box"><span class="timer">Time: <span id="clock">'+formatTime(s.seconds)+'</span></span> | <span class="status">Question '+(i+1)+' of '+s.items.length+'</span></div><div class="question"><small>'+q.topic+' • '+q.id+'</small><h2>'+q.question+'</h2>'+choices+'</div><div class="row"><button id="ep" class="btn secondary">Previous</button><button id="en" class="btn primary">Next</button><button id="es" class="btn secondary">Submit</button></div>';const radios=area.querySelectorAll('input[name=ea]');for(let r=0;r<radios.length;r++)radios[r].onchange=function(){s.answers[i]=parseInt(this.value,10)};document.getElementById('ep').onclick=function(){s.index=Math.max(0,i-1);renderExam()};document.getElementById('en').onclick=function(){s.index=Math.min(s.items.length-1,i+1);renderExam()};document.getElementById('es').onclick=submitExam}
function submitExam(){const s=examSession;if(!s||s.done)return;s.done=true;clearInterval(timerId);let score=0,answered=0;for(let i=0;i<s.items.length;i++){if(s.answers[i]!==undefined)answered++;if(s.answers[i]===s.items[i].a)score++}const pct=Math.round(score/s.items.length*100);history.unshift({date:new Date().toISOString(),total:s.items.length,score:score,pct:pct});document.getElementById('examArea').innerHTML='<div class="box"><div class="big">'+score+'/'+s.items.length+' ('+pct+'%)</div><p>'+answered+' answered.</p></div>'}
function simulators(){app.innerHTML='<section class="card"><h2>Explained Simulators</h2><div class="grid"><div class="box"><h3>Quorum</h3><p>R+W&gt;N forces read/write overlap. 2W&gt;N forces write/write overlap.</p><input id="n" value="5"><input id="rw" value="3,3"><button id="qr" class="btn primary">Run</button><div id="qo"></div></div><div class="box"><h3>Bully Election</h3><p>The highest active process identifier wins.</p><input id="ids" value="1,2,4,5"><button id="br" class="btn primary">Run</button><div id="bo"></div></div></div></section>';document.getElementById('qr').onclick=function(){const v=document.getElementById('rw').value.split(','),r=parseInt(v[0],10),w=parseInt(v[1],10),n=parseInt(document.getElementById('n').value,10);document.getElementById('qo').innerHTML='R+W&gt;N: <b>'+(r+w>n)+'</b><br>2W&gt;N: <b>'+(2*w>n)+'</b>'};document.getElementById('br').onclick=function(){const a=document.getElementById('ids').value.split(',').map(Number);document.getElementById('bo').innerHTML='Coordinator: <b>'+Math.max.apply(null,a)+'</b>'}}
function reports(){let out='<section class="card"><h2>Reports</h2>';if(!history.length)out+='<p>No reports yet.</p>';for(let i=0;i<history.length;i++)out+='<div class="box">'+new Date(history[i].date).toLocaleString()+' • '+history[i].total+' questions • '+history[i].pct+'%</div>';app.innerHTML=out+'</section>'}home();
</script></body></html>
