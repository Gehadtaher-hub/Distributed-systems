difficulty":"medium","id":"C7Q4"},{"q":"Applied scenario: Retries require care because they may:","o":["Remove timeouts","Share memory","Duplicate side effects","Reduce availability always"],"a":2,"e":"Applied interpretation: A lost response can cause an operation to be repeated.","difficulty":"scenario","id":"C7Q14"},{"q":"Graceful degradation means:","o":["Hide all errors","No replicas","Reduced service instead of total failure","All nodes stop"],"a":2,"e":"Essential functions remain available.","difficulty":"hard","id":"C7Q5"},{"q":"Applied scenario: Graceful degradation means:","o":["No replicas","Reduced service instead of total failure","All nodes stop","Hide all errors"],"a":1,"e":"Applied interpretation: Essential functions remain available.","difficulty":"scenario","id":"C7Q15"},{"q":"Failover is:","o":["Cache miss","Switching to a healthy component","Deleting replicas","Ignoring failure"],"a":1,"e":"Service transfers to redundancy.","difficulty":"easy","id":"C7Q6"},{"q":"Applied scenario: Failover is:","o":["Switching to a healthy component","Deleting replicas","Ignoring failure","Cache miss"],"a":0,"e":"Applied interpretation: Service transfers to redundancy.","difficulty":"scenario","id":"C7Q16"},{"q":"Checkpointing saves:","o":["Recoverable execution state","Names","RPC data","Cache entries"],"a":0,"e":"Execution can resume from a checkpoint.","difficulty":"medium","id":"C7Q7"},{"q":"Applied scenario: Checkpointing saves:","o":["Names","RPC data","Cache entries","Recoverable execution state"],"a":3,"e":"Applied interpretation: Execution can resume from a checkpoint.","difficulty":"scenario","id":"C7Q17"},{"q":"A crash failure means:","o":["Different values","Clock runs fast","Cache hit","Component stops acting"],"a":3,"e":"The process halts.","difficulty":"hard","id":"C7Q8"},{"q":"Applied scenario: A crash failure means:","o":["Clock runs fast","Cache hit","Component stops acting","Different values"],"a":2,"e":"Applied interpretation: The process halts.","difficulty":"scenario","id":"C7Q18"},{"q":"Failure detectors use suspicion because:","o":["Perfect heartbeats","Shared clock","Delay and failure can look alike","Zero delay"],"a":2,"e":"Silence can mean slowness or failure.","difficulty":"easy","id":"C7Q9"},{"q":"Applied scenario: Failure detectors use suspicion because:","o":["Shared clock","Delay and failure can look alike","Zero delay","Perfect heartbeats"],"a":1,"e":"Applied interpretation: Silence can mean slowness or failure.","difficulty":"scenario","id":"C7Q19"},{"q":"Recovery time affects:","o":["CPU count","Outage duration","Namespace shape","Marshaling"],"a":1,"e":"Faster recovery reduces disruption.","difficulty":"medium","id":"C7Q10"},{"q":"Applied scenario: Recovery time affects:","o":["Outage duration","Namespace shape","Marshaling","CPU count"],"a":0,"e":"Applied interpretation: Faster recovery reduces disruption.","difficulty":"scenario","id":"C7Q20"}]}];let profile=load('ds_profile',{}),practice=load('ds_study',{}),history=load('ds_history',[]),run=null,tick=null;const app=document.getElementById('app'),who=document.getElementById('who');function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('ds_profile',JSON.stringify(profile));localStorage.setItem('ds_study',JSON.stringify(practice));localStorage.setItem('ds_history',JSON.stringify(history));who.textContent=profile.name||'Guest'}function all(){let a=[];chapters.forEach((c,ci)=>c.questions.forEach((q,qi)=>a.push({c,ci,q,qi})));return a}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function go(n,b){clearInterval(tick);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');({home,study,challenge,exam:examSetup,mastery,results,profile:profilePage}[n])()}function home(){app.innerHTML=`<section class="card"><span class="tag">Student edition • ${all().length}-question bank</span><h2>Welcome, ${profile.name||'student'}</h2><p>Practice with explanations, attempt challenges, take controlled examinations, and monitor chapter mastery.</p><div class="grid"><div class="metric"><strong>${Object.keys(practice).length}</strong><br>answers practiced</div><div class="metric"><strong>${history.length}</strong><br>assessments</div><div class="metric"><strong>${all().length}</strong><br>questions</div><div class="metric"><strong>7</strong><br>chapters</div></div><div class="row"><button class="btn primary" onclick="study()">Practice now</button><button class="btn secondary" onclick="challenge()">Challenge</button><button class="btn secondary" onclick="examSetup()">Final exam</button></div></section>`}function study(ci=0){let c=chapters[ci];app.innerHTML=`<section class="card"><span class="tag">Practice mode</span><h2>${c.title}</h2><p>${c.summary}</p><select onchange="study(+this.value)">${chapters.map((x,i)=>`<option value="${i}" ${i==ci?'selected':''}>Chapter ${i+1}: ${x.title}</option>`).join('')}</select>${c.questions.map((q,i)=>`<div class="question"><b>${i+1}. ${q.q}</b><div class="tiny">Difficulty: ${q.difficulty}</div>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="p${ci}_${i}" onchange="answer(${ci},${i},${j})"> ${o}</label>`).join('')}<div id="f${ci}_${i}"></div></div>`).join('')}</section>`}function answer(ci,qi,s){let q=chapters[ci].questions[qi];practice[ci+'_'+qi]={s,correct:s===q.a};save();document.getElementById('f'+ci+'_'+qi).innerHTML=(s===q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+q.e}function challenge(){start('Challenge',shuffle(all()).slice(0,10),300,true,60)}function examSetup(){app.innerHTML=`<section class="card"><span class="tag">Examination mode</span><h2>Configure assessment</h2><div class="grid"><label>Questions<select id="cnt"><option>20</option><option selected>40</option><option>60</option><option>100</option><option>140</option></select></label><label>Minutes<input id="mins" type="number" value="45"></label><label>Passing grade<input id="pass" type="number" value="60"></label></div><button class="btn primary" onclick="makeExam()">Start examination</button></section>`}function makeExam(){start('Examination',shuffle(all()).slice(0,+cnt.value),+mins.value*60,false,+pass.value)}function start(title,items,seconds,feedback,pass){run={title,items,seconds,feedback,pass,answers:{},flags:{},idx:0,start:Date.now()};render();tick=setInterval(()=>{run.seconds--;let t=document.getElementById('timer');if(t)t.textContent=fmt(run.seconds);if(run.seconds<=0)submit()},1000)}function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function render(){let x=run.items[run.idx],s=run.answers[run.idx];app.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><span class="tag">${run.title}</span><span class="timer" id="timer">${fmt(run.seconds)}</span></div><div class="navigator">${run.items.map((_,i)=>`<button class="${i===run.idx?'cur ':''}${run.answers[i]!==undefined?'ans ':''}${run.flags[i]?'flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="progress"><div style="width:${Object.keys(run.answers).length/run.items.length*100}%"></div></div><div class="question"><div class="tiny">Chapter ${x.ci+1} • ${x.q.difficulty}</div><h2>${run.idx+1}. ${x.q.q}</h2>${x.q.o.map((o,j)=>`<label class="option"><input type="radio" name="r" ${s===j?'checked':''} onchange="runAnswer(${j})"> ${o}</label>`).join('')}${run.feedback&&s!==undefined?'<p>'+(s===x.q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>')+x.q.e+'</p>':''}</div><div class="row"><button class="btn secondary" onclick="jump(${Math.max(0,run.idx-1)})">Previous</button><button class="btn secondary" onclick="flag()">Flag</button><button class="btn primary" onclick="jump(${Math.min(run.items.length-1,run.idx+1)})">Next</button><button class="btn secondary" onclick="submit()">Submit</button></div></section>`}function jump(i){run.idx=i;render()}function flag(){run.flags[run.idx]=!run.flags[run.idx];render()}function runAnswer(j){run.answers[run.idx]=j;render()}function submit(){clearInterval(tick);let score=run.items.filter((x,i)=>run.answers[i]===x.q.a).length,pct=Math.round(score/run.items.length*100),r={date:new Date().toISOString(),title:run.title,score,total:run.items.length,pct,pass:run.pass,time:Math.round((Date.now()-run.start)/1000)};history.unshift(r);save();report(r)}function mastery(){app.innerHTML=`<section class="card"><h2>Chapter mastery</h2><table><tr><th>Chapter</th><th>Attempted</th><th>Accuracy</th></tr>${chapters.map((c,i)=>{let k=Object.keys(practice).filter(x=>x.startsWith(i+'_')),n=k.filter(x=>practice[x].correct).length;return`<tr><td>${c.title}</td><td>${k.length}</td><td>${k.length?Math.round(n/k.length*100):0}%</td></tr>`}).join('')}</table></section>`}function report(r){app.innerHTML=`<section class="card"><h2>${r.title} report</h2><div class="big">${r.score}/${r.total} (${r.pct}%)</div><p class="${r.pct>=r.pass?'good':'bad'}">${r.pct>=r.pass?'Passed':'Not passed'} • ${fmt(r.time)}</p><button class="btn primary" onclick="print()">Print / Save PDF</button></section>`}function results(){app.innerHTML=`<section class="card"><h2>Assessment reports</h2>${history.length?history.map((r,i)=>`<div class="question">${new Date(r.date).toLocaleString()} • ${r.title} • ${r.pct}% <button class="btn secondary" onclick="report(history[${i}])">View</button></div>`).join(''):'No reports yet.'}</section>`}function profilePage(){app.innerHTML=`<section class="card"><h2>Profile & backup</h2><input id="pn" placeholder="Name" value="${profile.name||''}"><input id="pi" placeholder="Student ID" value="${profile.id||''}"><button class="btn primary" onclick="profile={name:pn.value,id:pi.value};save();home()">Save</button><button class="btn secondary" onclick="backup()">Export backup</button></section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({profile,practice,history},null,2)],{type:'application/json'}));a.download='ds_progress.json';a.click()}function accessibility(){app.innerHTML=`<section class="card"><h2>Accessibility</h2><button class="btn secondary" onclick="document.body.classList.toggle('dark')">Dark mode</button><button class="btn secondary" onclick="document.body.classList.toggle('high')">High contrast</button><button class="btn secondary" onclick="document.documentElement.style.setProperty('--fs','18px')">Larger text</button></section>`}save();home();</script></body></html>
