<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distributed Systems Studio</title><style>:root{--bg:#eee5d3;--card:#fffaf0;--ink:#263238;--navy:#18324a;--wine:#7a263a;--line:#d8c8a4;--gold:#c59b45;--good:#26734d;--bad:#a23a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}header{background:var(--navy);color:#fff;padding:14px 18px;border-bottom:5px solid var(--gold);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.btn{border:1px solid var(--gold);border-radius:9px;padding:10px 13px;font:bold 14px system-ui;cursor:pointer;background:var(--card);color:var(--navy);text-decoration:none}.primary{background:var(--wine);color:#fff}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 75px)}aside{background:var(--card);padding:12px}.nav{display:block;width:100%;margin:7px 0}.nav.active{background:var(--wine);color:white}main{max-width:1000px;width:100%;padding:18px;margin:auto}.card,.question{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:12px}.option{display:block;border:1px solid var(--line);padding:11px;border-radius:9px;margin:8px 0}.option input{width:auto}.row{display:flex;gap:8px;flex-wrap:wrap}.big{font-size:30px;color:var(--wine);font-weight:bold}.good{color:var(--good)}.bad{color:var(--bad)}select,input{padding:10px;width:100%;margin:6px 0}.timer{font-size:24px;font-weight:bold}.error{color:var(--bad)}@media(max-width:700px){.layout{display:block}aside{display:flex;gap:6px;overflow:auto}.nav{min-width:120px}main{padding:10px}}</style></head><body><header><h1>Distributed Systems Studio</h1><a class="btn" href="index.html">Back to eBook</a></header><div class="layout"><aside><button class="btn nav active" data-page="home">Dashboard</button><button class="btn nav" data-page="practice">Practice</button><button class="btn nav" data-page="exam">Timed Exam</button></aside><main id="app"><section class="card"><h2>Loading question bank…</h2></section></main></div><script>
'use strict';let bank=[],session=null,timer=null;const app=document.getElementById('app');function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function sample(n,topic){return shuffle(bank.filter(q=>!topic||q.topic===topic)).slice(0,n)}function topics(){return [...new Set(bank.map(q=>q.topic))].sort()}function home(){app.innerHTML='<section class="card"><h2>Question Bank Ready</h2><div class="big">'+bank.length+'</div><p>Questions loaded from <b>question_bank.json</b>.</p><p>Choose Practice or Timed Exam.</p></section>'}function setup(kind){const ts=topics().map(t=>'<option>'+t+'</option>').join('');app.innerHTML='<section class="card"><h2>'+(kind==='exam'?'Timed Exam':'Practice')+'</h2><label>Topic<select id="topic"><option value="">All Topics</option>'+ts+'</select></label><label>Questions<input id="count" type="number" min="1" max="'+bank.length+'" value="20"></label>'+(kind==='exam'?'<label>Minutes<input id="minutes" type="number" min="1" value="30"></label>':'')+'<button id="start" class="btn primary">Start</button><div id="area"></div></section>';start.onclick=()=>{let items=sample(Math.min(bank.length,+count.value||20),topic.value);session={kind,items,i:0,answers:[],checked:[],seconds:kind==='exam'?(+minutes.value||30)*60:0};render();if(kind==='exam'){clearInterval(timer);timer=setInterval(()=>{session.seconds--;const c=document.getElementById('clock');if(c)c.textContent=format(session.seconds);if(session.seconds<=0)finish()},1000)}}}function format(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function render(){const s=session,q=s.items[s.i],area=document.getElementById('area');let options=q.options.map((o,j)=>'<label class="option"><input type="radio" name="answer" value="'+j+'" '+(s.answers[s.i]===j?'checked':'')+'> '+o+'</label>').join('');let feedback=s.kind==='practice'&&s.checked[s.i]!==undefined?'<p class="'+(s.checked[s.i]?'good':'bad')+'">'+(s.checked[s.i]?'Correct. ':'Incorrect. ')+q.explanation+'</p>':'';area.innerHTML='<div class="question">'+(s.kind==='exam'?'<span id="clock" class="timer">'+format(s.seconds)+'</span> · ':'')+'Question '+(s.i+1)+' of '+s.items.length+'<small> · '+q.topic+' · '+q.id+'</small><h2>'+q.question+'</h2>'+options+feedback+'<div class="row"><button id="prev" class="btn">Previous</button>'+(s.kind==='practice'?'<button id="check" class="btn primary">Check</button>':'')+'<button id="next" class="btn">Next</button><button id="finish" class="btn">Finish</button></div></div>';area.querySelectorAll('input').forEach(r=>r.onchange=()=>s.answers[s.i]=+r.value);prev.onclick=()=>{s.i=Math.max(0,s.i-1);render()};next.onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);render()};if(s.kind==='practice')check.onclick=()=>{if(s.answers[s.i]===undefined)return alert('Select an answer.');s.checked[s.i]=s.answers[s.i]===q.answer;render()};document.getElementById('finish').onclick=finish}function finish(){clearInterval(timer);const s=session;let correct=s.items.reduce((n,q,i)=>n+(s.answers[i]===q.answer),0);let answered=s.answers.filter(x=>x!==undefined).length;document.getElementById('area').innerHTML='<div class="question"><div class="big">'+correct+' / '+s.items.length+'</div><p>'+answered+' answered · '+Math.round(correct/s.items.length*100)+'%</p><button class="btn primary" onclick="setup(\''+s.kind+'\')">Try again</button></div>'}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{clearInterval(timer);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');b.dataset.page==='home'?home():setup(b.dataset.page)});fetch('question_bank.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{bank=data;home()}).catch(e=>{app.innerHTML='<section class="card"><h2 class="error">Question bank could not be loaded</h2><p>Run this folder through a local web server or GitHub Pages. Example: <code>python -m http.server 8000</code>, then open <code>http://localhost:8000</code>.</p><p>'+e+'</p></section>'});
</script></body></html>
